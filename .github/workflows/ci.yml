name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run tests
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t books-server .
      - name: Start the container and check the health endpoint
        run: |
          docker run -d --name books -p 8574:8574 books-server
          for i in $(seq 1 15); do
            curl -fs localhost:8574/books/health && exit 0
            sleep 1
          done
          docker logs books
          exit 1
